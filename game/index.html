<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1d2a">
  <meta name="description" content="Tilt the board, sort the balls. A puzzle game.">
  <title>Gravity Flip Sort</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Home: title and level picker -->
    <section id="home" class="screen">
      <header class="title">
        <h1>Gravity<br>Flip Sort</h1>
        <p class="tagline">Tilt the board. Sort the balls.</p>
      </header>
      <p class="progress" id="home-progress"></p>
      <button class="btn primary big" id="play-btn">Play</button>
      <h2 class="section-label">Levels</h2>
      <div class="level-grid" id="level-grid"></div>
    </section>

    <!-- Game -->
    <section id="game" class="screen" hidden>
      <header class="hud">
        <button class="icon-btn" id="back-btn" aria-label="Back to levels">‹</button>
        <div class="hud-center">
          <div class="level-label" id="level-label">Level 1</div>
          <div class="moves" id="moves">Moves 0 · Best 0</div>
        </div>
        <button class="icon-btn" id="restart-btn" aria-label="Restart level">↻</button>
      </header>
      <p class="help" id="help">Swipe to tilt the board. Every ball rolls until it hits something.</p>
      <div class="board-wrap" id="board-wrap">
        <canvas id="board" aria-label="Game board"></canvas>
        <div class="hint-arrow" id="hint-arrow" hidden></div>
      </div>
      <footer class="controls">
        <button class="btn" id="undo-btn">Undo</button>
        <button class="btn" id="hint-btn">Hint</button>
      </footer>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </section>

    <!-- Level complete -->
    <div class="overlay" id="win" hidden>
      <div class="card">
        <h2>Sorted!</h2>
        <div class="stars" id="win-stars" aria-label="Stars"></div>
        <p id="win-text"></p>
        <div class="card-actions">
          <button class="btn" id="replay-btn">Replay</button>
          <button class="btn primary" id="next-btn">Next</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
