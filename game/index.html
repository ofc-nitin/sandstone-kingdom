<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#24170f">
  <title>Sandstone Kingdom</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #24170f; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; position: fixed; inset: 0; }
    /* reads the phone's notch / rounded-corner insets so the HUD can avoid them */
    #safe-probe { position: fixed; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body>
  <div id="safe-probe"></div>
  <canvas id="game"></canvas>
  <script src="vendor/capacitor.js"></script>
  <script src="src/art/art.js"></script>
  <script src="src/art/ui-art.js"></script>
  <script src="src/art/scenes-art.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
